<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Wall-e</title>
    <!-- Importamos el componente model-viewer de Google -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: #e0e0e0; /* Fondo gris claro */
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        model-viewer {
            width: 100%;
            height: 100vh;
            background-color: #e0e0e0;
        }
        /* Descripción flotante abajo con fondo transparente */
        .info-overlay {
            position: absolute;
            bottom: 20px;
            background: rgba(255, 255, 255, 0.2);
            backdrop-filter: blur(5px);
            padding: 10px 20px;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            pointer-events: none;
            box-shadow: 0 2px 6px rgba(0,0,0,0.05);
        }
    </style>
</head>
<body>

    <!-- Visor 3D interactivo a pantalla completa -->
    <model-viewer src="wall-e.glb.txt" alt="Modelo 3D de Wall-e" auto-rotate camera-controls></model-viewer>

    <!-- Breve descripción abajo -->
    <div class="info-overlay">Recuerdo souvenir del viaje a Tandil Mayo 2024</div>

</body>
</html>
