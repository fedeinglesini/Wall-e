<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Wall-e</title>
    <!-- Importamos el componente de model-viewer de Google -->
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background-color: #dcdcdc; /* Fondo gris claro */
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
        }
        /* Descripción flotante abajo con fondo transparente */
        .info-overlay {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <model-viewer 
        src="https://raw.githubusercontent.com/fedeinglesini/Wall-e/main/walle.glb.txt" 
        alt="Visor Wall-e" 
        auto-rotate 
        camera-controls 
        shadow-intensity="1">
    </model-viewer>

    <div class="info-overlay">Recuerdo souvenir del viaje a Tandil Mayo 2024</div>

</body>
</html>
