<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Visor Wall-e</title>
    <script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>
    <style>
        body, html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            background-color: #dcdcdc;
            overflow: hidden;
            font-family: Arial, sans-serif;
        }
        model-viewer {
            width: 100%;
            height: 100%;
            background-color: #dcdcdc;
        }
        .info-overlay {
            position: fixed;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(4px);
            padding: 8px 16px;
            border-radius: 8px;
            color: #333;
            font-size: 14px;
            pointer-events: none;
            z-index: 10;
        }
    </style>
</head>
<body>

    <model-viewer src="walle.glb.txt" alt="Wall-e" auto-rotate camera-controls></model-viewer>

    <div class="info-overlay">Recuerdo souvenir del viaje a Tandil Mayo 2024</div>

</body>
</html>
